<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beer Style Atlas</title>
  <meta name="description" content="An interactive map of every beer style, nested and grouped by similarity, with general recipes and top-selling examples.">
  <meta name="theme-color" content="#120f0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#searchInput">Skip to search</a>
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🍺</span>
      <h1>Beer Style Atlas</h1>
    </div>
    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <input id="searchInput" type="search" placeholder="Search styles, beers, hops…" autocomplete="off" spellcheck="false" enterkeyhint="go"
             role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list" aria-label="Search beer styles">
      <ul id="searchResults" class="search-results" role="listbox" aria-label="Search results" hidden></ul>
    </div>
    <div class="actions">
      <button class="icon-btn" id="randomBtn" type="button" aria-label="Show a random style" title="Random style">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm0 2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H6zm2.5 2a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM8.5 14a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C12.92 3.04 12.46 3 12 3z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42zM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12zM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12z"/></svg>
      </button>
    </div>
    <nav class="families" id="families" aria-label="Beer families"></nav>
    <div class="subbar">
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"><ol></ol></nav>
      <div class="legend" role="img" aria-label="Dot colour shows beer colour, from pale (SRM 2) to black (SRM 40)">
        <span aria-hidden="true">Pale</span><i aria-hidden="true"></i><span aria-hidden="true">Dark</span>
      </div>
    </div>
  </header>

  <main id="stage" class="stage">
    <svg id="chart" role="group" aria-label="Beer River: every beer style placed on a timeline, grouped into family streams, with lines tracing which styles descended from which. Use Tab to move between styles and Enter to open one."></svg>
    <nav class="traits" id="traits" aria-label="Highlight styles by trait"></nav>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <div class="hint" id="hint" aria-hidden="true">Tap a bubble to explore · pinch to zoom</div>
    <div class="loading" id="loading" role="status"><span class="loading-glass" aria-hidden="true"></span>Pouring…</div>
  </main>

  <aside id="panel" class="panel" aria-label="Style details" aria-hidden="true" data-state="closed" inert>
    <div class="sheet-handle" id="sheetHandle" aria-hidden="true"><span></span></div>
    <button class="icon-btn panel-close" id="panelClose" type="button" aria-label="Close details">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <div class="panel-body" id="panelBody"></div>
  </aside>
  <div class="sab-probe" id="sabProbe" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
