<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beer Style Atlas</title>
  <meta name="description" content="An interactive map of every beer style, nested and grouped by similarity, with general recipes and top-selling examples.">
  <meta name="theme-color" content="#120f0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🍺</span>
      <h1>Beer Style Atlas</h1>
    </div>
    <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Toggle light/dark theme">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C12.92 3.04 12.46 3 12 3z"/></svg>
    </button>
    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <input id="searchInput" type="search" placeholder="Search styles, beers, hops…" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list" aria-label="Search beer styles">
      <ul id="searchResults" class="search-results" role="listbox" hidden></ul>
    </div>
    <nav class="families" id="families" aria-label="Beer families"></nav>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </header>

  <main id="stage" class="stage">
    <svg id="chart" role="img" aria-label="Zoomable bubble chart of beer styles"></svg>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <div class="hint" id="hint">Tap a bubble to explore · pinch or scroll to zoom</div>
    <div class="loading" id="loading">Pouring…</div>
  </main>

  <aside id="panel" class="panel" aria-label="Style details" aria-hidden="true" data-state="closed">
    <div class="sheet-handle" id="sheetHandle" aria-hidden="true"><span></span></div>
    <button class="icon-btn panel-close" id="panelClose" type="button" aria-label="Close details">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
